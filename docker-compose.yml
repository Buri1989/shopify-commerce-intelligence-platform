# The local MySQL for development: `docker compose up -d` before `npm run dev`.
# The login is dev-only and mirrored by .env.example; the server listens on
# this machine's loopback and nowhere else. The root password is generated at
# first start and printed in the container log, since nothing here uses root.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commerce_intelligence
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
