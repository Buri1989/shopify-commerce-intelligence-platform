name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      imageTag:
        description: Full commit SHA of an image already in the repository. This is the rollback button.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.imageTag || github.sha }}
  ECR_REPOSITORY: commerce-intelligence-dev

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/checks.yml

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: build-${{ github.run_id }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [checks, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}
      - name: Check that the image exists before touching any stack
        run: |
          missing=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'length(failures)' --output text)
          if [ "$missing" != "0" ]; then
            echo "No image tagged $IMAGE_TAG in $ECR_REPOSITORY"
            exit 1
          fi
      - name: Deploy the delivery and migration stacks
        working-directory: infra
        env:
          CDK_DISABLE_VERSION_CHECK: '1'
        run: npm run -s deploy -- commerce-intelligence-dev-delivery commerce-intelligence-dev-migration --require-approval never --progress events --no-notices --outputs-file "$RUNNER_TEMP/migration-outputs.json" -c imageTag="$IMAGE_TAG"
      - id: migrate
        name: Run the migrations
        run: |
          read_output() { jq -r --arg name "$1" '."commerce-intelligence-dev-migration"[$name]' "$RUNNER_TEMP/migration-outputs.json"; }
          cluster=$(read_output ClusterName)
          log_group=$(read_output LogGroupName)
          started=$(aws ecs run-task --cluster "$cluster" --task-definition "$(read_output TaskDefinitionArn)" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$(read_output SubnetIds)],securityGroups=[$(read_output SecurityGroupId)],assignPublicIp=DISABLED}" --started-by "deploy-$GITHUB_RUN_ID" --output json)
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<< "$started")
          if [ -z "$task_arn" ]; then
            echo "No task was started: $(jq -r '.failures[0].reason // "no reason given"' <<< "$started")"
            exit 1
          fi
          echo "Started $task_arn"
          until [ "$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query 'tasks[0].lastStatus' --output text)" = "STOPPED" ]; do
            sleep 10
          done
          task=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query 'tasks[0]')
          aws logs get-log-events --log-group-name "$log_group" --log-stream-name "migration/migration/${task_arn##*/}" --start-from-head --query 'events[].message' --output json 2>/dev/null | jq -r '.[]' | tee "$RUNNER_TEMP/migration.log"
          exit_code=$(jq -r '.containers[0].exitCode // empty' <<< "$task")
          echo "Stopped: $(jq -r '.stoppedReason' <<< "$task"); exit code ${exit_code:-none}"
          if [ "$exit_code" != "0" ]; then
            exit 1
          fi
      - id: deploy
        name: Deploy all stacks
        working-directory: infra
        env:
          CDK_DISABLE_VERSION_CHECK: '1'
        run: |
          set -o pipefail
          npm run -s deploy -- --all --require-approval never --progress events --no-notices --outputs-file "$RUNNER_TEMP/outputs.json" -c imageTag="$IMAGE_TAG" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - id: health
        name: Check /health and /ready from outside
        run: |
          api_url=$(jq -r '."commerce-intelligence-dev-app".ApiUrl' "$RUNNER_TEMP/outputs.json")
          answers_200() {
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -sS -o /dev/null -w '%{http_code}' "$1" || true)
              echo "$1 -> ${status:-no answer} (attempt $attempt)"
              if [ "$status" = "200" ]; then
                echo "| $1 | $status |" >> "$RUNNER_TEMP/health.md"
                return 0
              fi
              sleep 10
            done
            echo "| $1 | ${status:-no answer} |" >> "$RUNNER_TEMP/health.md"
            return 1
          }
          answers_200 "$api_url/health"
          answers_200 "$api_url/ready"
      - name: Write the run summary
        if: always()
        run: |
          kind="Deploy of commit"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then kind="Rollback to image"; fi
          console_log_group() { jq -r --arg stack "$1" '.[$stack].LogGroupName // empty' "$2" 2>/dev/null | sed 's#/#$252F#g'; }
          log_group=$(console_log_group commerce-intelligence-dev-app "$RUNNER_TEMP/outputs.json")
          migration_log_group=$(console_log_group commerce-intelligence-dev-migration "$RUNNER_TEMP/migration-outputs.json")
          applied=$(jq -r 'select(.applied != null) | .applied' "$RUNNER_TEMP/migration.log" 2>/dev/null | tail -1)
          case "${{ steps.migrate.outcome }}:$applied" in
            success:0) migrations="nothing to run" ;;
            success:?*) migrations="applied $applied" ;;
            failure:*) migrations="failed" ;;
            *) migrations="${{ steps.migrate.outcome }}" ;;
          esac
          {
            echo "## $kind \`$IMAGE_TAG\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Migrations | $migrations |"
            echo "| Deploy | ${{ steps.deploy.outcome }} |"
            echo "| Health | ${{ steps.health.outcome }} |"
            echo
            echo "### Stacks"
            grep -E '^(✅|❌)' "$RUNNER_TEMP/deploy.log" 2>/dev/null | sed 's/^/- /' || echo "- no stack result recorded"
            echo
            echo "### API"
            echo "| URL | Status |"
            echo "|---|---|"
            cat "$RUNNER_TEMP/health.md" 2>/dev/null || echo "| not checked | |"
            echo
            echo "[CloudFormation](https://$AWS_REGION.console.aws.amazon.com/cloudformation/home?region=$AWS_REGION#/stacks?filteringText=commerce-intelligence-dev) · [Log group](https://$AWS_REGION.console.aws.amazon.com/cloudwatch/home?region=$AWS_REGION#logsV2:log-groups/log-group/$log_group) · [Migration log](https://$AWS_REGION.console.aws.amazon.com/cloudwatch/home?region=$AWS_REGION#logsV2:log-groups/log-group/$migration_log_group)"
          } >> "$GITHUB_STEP_SUMMARY"
